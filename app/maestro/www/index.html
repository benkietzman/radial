<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta charset="utf-8">
    <title>Maestro</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link href="/favicon.ico" rel="shortcut icon">
    <link href="/favicon.png" rel="shortcut icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/codemirror@5/lib/codemirror.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/codemirror@5/theme/dracula.css" rel="stylesheet">
    <link href="/include/common/css/common.css" rel="stylesheet">
    <link href="/include/common/css/sticky-footer.css" rel="stylesheet">
    <style>
      #editor-box
      {
        height: 300px;
        min-height: 150px;
        display: flex;
        flex-direction: column;
        border: 1px solid #aaa;
      }
      #editor-box .CodeMirror
      {
        flex: 1 1 auto;
        min-height: 0;
        height: auto;
      }
      #resize-handle
      {
        flex: 0 0 12px;
        cursor: ns-resize;
        touch-action: none;
        background: #eee;
        display: grid;
        place-items: center;
      }
      #resize-handle::after
      {
        content: "";
        width: 36px;
        border-top: 2px solid #888;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5/lib/codemirror.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5/mode/javascript/javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4/dist/handlebars.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lodash@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/navigo@8"></script>
    <script src="/include/common/js/Common.js"></script>
    <script src="App.js"></script>
  </head>
  <body>
    <div style="height: 100%;">
      <div id="wrap">
        <div id="menu"></div>
        <div class="container">
          <div id="messages"></div>
          <div id="app"></div>
        </div>
      </div>
      <div id="radialStatus"></div>
      <div id="footer"></div>
      <div id="centralMenu"></div>
      <div id="radialChat"></div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
